name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          INTERNAL_BACKEND_URL: http://backend:8090

  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest test/test_gpu_queue.py -q
        env:
          PYTHONPATH: .
          JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters-long

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
        env:
          JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
          GENERATOR_3D_SECRET: ci-only-generator-secret-at-least-32-chars
          NEXTAUTH_SECRET: ci
          NEXTAUTH_URL: http://localhost:3000
